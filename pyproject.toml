[project]
name = "authen_authori"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "crym_o", email = "beros.josemyrson.oreo1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "users>=1.0.dev0",
    "uvicorn>=0.54.0",
]

[project.scripts]
authen_authori = "authen_authori:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
